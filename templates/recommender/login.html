{% extends 'base.html' %}
{% block title %}Login - AI LearnHub{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card p-5">
            <div class="text-center mb-4">
                <i class="fa-solid fa-right-to-bracket fa-3x text-gradient mb-3"></i>
                <h2 class="fw-bold">Welcome Back</h2>
                <p class="text-muted">Log in to continue your learning journey</p>
            </div>
            
            <form method="post">
                {% csrf_token %}
                {% if request.GET.next %}
                <input type="hidden" name="next" value="{{ request.GET.next }}">
                {% endif %}
                
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" name="username" class="form-control" required placeholder="Enter your username">
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control" required placeholder="Enter your password">
                </div>
                
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary-custom btn-lg">Log In</button>
                </div>
            </form>
            
            <div class="text-center mt-4">
                <p class="mb-0">Don't have an account? <a href="{% url 'register' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}" class="text-decoration-none fw-bold">Register here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
